aipp_op {
    aipp_mode : static
    
    # 彻底改用 RGB 的 HWC 无损原生排布！
    input_format : RGB888_U8 
    
    src_image_size_w : 640
    src_image_size_h : 640
    crop : false
    
    # 全部置否，把颜色转换的负担统统卸掉，由 Python 准备好开袋即食
    csc_switch : false
    rbuv_swap_switch : false
    
    # 保留唯一且正统的任务：帮你将 0-255 的庞大数据完美压制到 0.0-1.0！
    mean_chn_0 : 0
    mean_chn_1 : 0
    mean_chn_2 : 0
    min_chn_0 : 0.0
    min_chn_1 : 0.0
    min_chn_2 : 0.0
    var_reci_chn_0: 0.00392156862745098
    var_reci_chn_1: 0.00392156862745098
    var_reci_chn_2: 0.00392156862745098
}
